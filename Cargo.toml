[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesedmond/monotile-ca"

[workspace.dependencies]
ca-engine = { path = "crates/ca-engine" }
tiling-core = { path = "crates/tiling-core" }
rayon = "1"

[profile.release]
lto = "thin"
